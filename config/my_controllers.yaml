# GAZEBO / ros2_control ONLY. Do not start controller_manager for the Phase-5 Python bridge.
controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    diff_cont:
      type: diff_drive_controller/DiffDriveController
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:
    publish_rate: 50.0
    base_frame_id: base_link
    odom_frame_id: odom
    left_wheel_names: ['left_wheel_joint']
    right_wheel_names: ['right_wheel_joint']
    wheel_separation: 0.300
    wheel_radius: 0.0435
    wheels_per_side: 1
    use_stamped_vel: false
    open_loop: false
    position_feedback: true
    enable_odom_tf: true
    cmd_vel_timeout: 0.5
